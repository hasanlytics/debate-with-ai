<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#2a1f5d"/>
      <stop offset="60%" stop-color="#141830"/>
      <stop offset="100%" stop-color="#0b0e1b"/>
    </radialGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c5cff"/>
      <stop offset="50%" stop-color="#d06bff"/>
      <stop offset="100%" stop-color="#ff5c8a"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c5cff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ff5c8a" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="url(#ring)" stroke-width="6" stroke-dasharray="16 12" opacity="0.6"/>
  <circle cx="256" cy="256" r="165" fill="#171b30" stroke="#2a2f4d" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="235" r="90" fill="url(#primary)" opacity="0.25" filter="url(#glow)"/>

  <!-- Microphone Main Body -->
  <rect x="216" y="145" width="80" height="150" rx="40" fill="url(#primary)" filter="url(#glow)"/>
  
  <!-- Mic Grille detail -->
  <line x1="226" y1="185" x2="286" y2="185" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="226" y1="205" x2="286" y2="205" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
  <line x1="226" y1="225" x2="286" y2="225" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

  <!-- Mic Cradle / Stand -->
  <path d="M176 230 C 176 310, 336 310, 336 230" fill="none" stroke="#f1f2f8" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Mic Stand Base -->
  <line x1="256" y1="310" x2="256" y2="365" stroke="#f1f2f8" stroke-width="14" stroke-linecap="round"/>
  <line x1="206" y1="365" x2="306" y2="365" stroke="#f1f2f8" stroke-width="14" stroke-linecap="round"/>

  <!-- Sound Waves (Debate sparks) -->
  <path d="M136 200 C 120 225, 120 265, 136 290" fill="none" stroke="#7c5cff" stroke-width="8" stroke-linecap="round"/>
  <path d="M376 200 C 392 225, 392 265, 376 290" fill="none" stroke="#ff5c8a" stroke-width="8" stroke-linecap="round"/>
</svg>
